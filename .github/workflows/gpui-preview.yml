name: gpui-preview

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - probes/**
      - .github/workflows/gpui-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUST_TOOLCHAIN: '1.99.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: gpui-release-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Build native preview and CLI
        run: cargo build --release --locked -p tune-gpui -p tune-cli
      - name: Stage binaries and their hashes
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          const suffix = process.platform === 'win32' ? '.exe' : '';
          const output = 'dist/gpui-preview';
          fs.mkdirSync(output, { recursive: true });
          const files = ['katala-tune-gpui', 'tune'].map(name => {
            const file = name + suffix;
            const bytes = fs.readFileSync(path.join('target', 'release', file));
            fs.writeFileSync(path.join(output, file), bytes, { mode: 0o755 });
            return { file, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') };
          });
          const manifest = { schema: 'katala_gpui_preview.v1', version: require('./package.json').version, revision: process.env.GITHUB_SHA, platform: process.platform, architecture: process.arch, files };
          fs.writeFileSync(path.join(output, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpui-preview-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/gpui-preview/
          if-no-files-found: error
          retention-days: 7
