[package]
name = "tune-link"
description = "Katala Tune の機体どうしの接続（機体鍵・ペアリング・端末間暗号化・要求と応答の形式）。経路に依存しない"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
# 暗号はよく使われているクレートの組み合わせだけで作る（選んだ理由と版は docs/connectivity.md）
spake2 = "0.4"
# 使う暗号だけを選ぶ（std を入れると ring まで入るので入れない。snow は alloc だけで動く）
snow = { version = "0.10", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
# X25519 の公開鍵計算だけに使う。spake2・snow・ed25519-dalek は 4.1.3 を使うため、Cargo.lock には両版が入る
curve25519-dalek = "5.0"
sha2 = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[lints]
workspace = true
