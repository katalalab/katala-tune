[package]
name = "tune-link"
description = "Katala Tune の機体どうしの接続（機体鍵・ペアリング・端末間暗号化・要求と応答の形式）。経路に依存しない"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
# 暗号はよく使われているクレートの組み合わせだけで作る（選んだ理由と版は docs/connectivity.md）
spake2 = "0.4"
# 使う暗号だけを選ぶ（std を入れると ring まで入るので入れない。snow は alloc だけで動く）
snow = { version = "0.10", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
# X25519 の公開鍵の計算だけに使う（spake2・snow・ed25519-dalek が使っているものと同じ版）
curve25519-dalek = "4.1"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

[lints]
workspace = true
