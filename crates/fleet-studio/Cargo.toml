[package]
name = "fleet-studio"
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.99"
publish = false

# Isolate GPUI's dependency graph from the existing Katala Tune lockfile.
[workspace]

[features]
default = []
gui = ["dep:gpui", "dep:chrono"]

[dependencies]
tune-core = { path = "../tune-core" }
serde_json = { version = "1", features = ["float_roundtrip"] }
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time"] }
url = "=2.5.8"
chrono = { version = "0.4", optional = true }
gpui = { version = "=0.2.2", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"], optional = true }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "fleet-studio"
path = "src/main.rs"
required-features = ["gui"]

[lints.rust]
unsafe_code = "deny"
