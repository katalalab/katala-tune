[package]
name = "tune-cli"
description = "Tauri なしで Katala Tune の分析エンジン（tune-core）を動かす検証用 CLI"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "tune"
path = "src/main.rs"

[dependencies]
tune-core.workspace = true
tune-link.workspace = true
zeroize = "1"
tempfile = "3"
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Console", "Win32_System_SystemInformation"] }

[lints]
workspace = true
