[package]
name = "tune-core"
description = "Katala Tune の分析エンジン（台帳・保存・調査の実行・判定・状態・ログ・変更操作の計画と検証）。Tauri に依存しない"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
encoding_rs = "0.8"
sha1_smol = "1"
# 出どころの台帳（区間の指紋・連鎖・調査スクリプトの指紋）。Tauri がすでに使っている版（Cargo.lock に既にある）
sha2 = "0.10"
dirs = "7"
gethostname = "1"

[lints]
workspace = true
