[package]
name = "tune-gpui"
description = "Katala Tune のネイティブ画面（GPUI）。分析エンジンは tune-core を直接呼ぶ"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "katala-tune-gpui"
path = "src/main.rs"

[dependencies]
tune-core.workspace = true
serde_json.workspace = true
tokio.workspace = true
gpui = "0.2.2"

[target.'cfg(target_os = "linux")'.dependencies]
# GPUI's HTTP client still uses xattr 0.2.3, which needs libc::ENOATTR.
# libc 0.2.190 removed that Linux alias. Remove this pin when GPUI updates xattr.
libc = "=0.2.189"

[lints]
workspace = true
